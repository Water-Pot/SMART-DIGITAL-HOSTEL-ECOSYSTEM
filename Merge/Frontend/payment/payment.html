<div
  class="card w-full max-w-md bg-base-100 shadow-2xl border-t-4 border-primary"
>
  <div class="card-body text-center">
    <div class="mb-4">
      <div class="avatar placeholder mb-2">
        <div class="bg-primary text-neutral-content rounded-full w-16">
          <span class="text-2xl">🔒</span>
        </div>
      </div>
      <h2 class="text-2xl font-bold">Secure Checkout</h2>
      <p class="text-gray-500 text-sm">Complete your room booking payment</p>
    </div>

    <div class="bg-base-200 rounded-lg p-5 text-left mb-6">
      <div
        class="flex justify-between items-center border-b border-base-300 pb-3 mb-3"
      >
        <span class="text-gray-500 font-semibold">Total Amount</span>
        <span id="displayAmount" class="text-3xl font-bold text-green-600"
          >৳ 0.00</span
        >
      </div>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-500">Billed To:</span>
          <span id="displayUser" class="font-semibold">Loading...</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">Room Details:</span>
          <span id="displayRoom" class="font-semibold">Loading...</span>
        </div>
        <div
          class="flex justify-between items-center mt-2 pt-2 border-t border-base-300"
        >
          <span class="text-gray-500">Payment Method:</span>
          <span
            id="displayMethod"
            class="badge badge-primary uppercase font-bold text-xs p-3"
            >Method</span
          >
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <button
        id="btnPay"
        class="btn btn-primary btn-lg w-full text-white"
        onclick="processPayment()"
      >
        Confirm & Pay
      </button>
      <button class="btn btn-ghost w-full" onclick="cancelPayment()">
        Cancel and return to Dashboard
      </button>
    </div>
    <p class="text-xs text-gray-400 mt-4">
      🔒 256-bit SSL encrypted secure transaction
    </p>
  </div>
</div>

<!-- Processing Overlay -->
<div
  id="processingOverlay"
  class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex-col items-center justify-center text-white"
>
  <span class="loading loading-spinner loading-lg text-primary mb-4"></span>
  <h3 class="text-2xl font-bold" id="overlayText">Processing Payment...</h3>
  <p class="text-sm opacity-80 mt-2">
    Please do not close or refresh this window.
  </p>
</div>
