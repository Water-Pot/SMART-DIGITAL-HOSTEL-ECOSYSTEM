<li><a onclick="add_mealType_modal.showModal()" class="text-primary">Add Meal Type</a></li>
<li><a onclick="openViewMealTypesModal()">Edit Meal Types</a></li>
<dialog id="mealType_list_modal" class="modal">
    <div class="modal-box w-11/12 max-w-3xl">
        <h3 class="font-bold text-xl mb-4 text-primary">⏳ Meal Types</h3>
        <div class="overflow-x-auto h-80 border border-base-300 rounded-xl">
            <table class="table table-zebra table-pin-rows w-full">
                <thead>
                    <tr class="bg-base-200">
                        <th>ID</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="mealTypeTableBody"></tbody>
            </table>
        </div>
        <div class="modal-action">
            <form method="dialog"><button class="btn">Close</button></form>
        </div>
    </div>
</dialog>
<dialog id="add_mealType_modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4 text-primary">⏳ Add Meal Type</h3>
        <form id="formAddMealType" class="space-y-3">
            <div class="form-control">
                <label class="label"><span class="label-text">Type Name</span></label>
                <input type="text" id="mealTypeName" class="input input-bordered w-full"
                    placeholder="e.g. Lunch" required />
            </div>
            <div class="modal-action">
                <button type="button" class="btn" onclick="add_mealType_modal.close()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</dialog>
<dialog id="edit_mealType_modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4 text-primary">✏️ Edit Meal Type</h3>
        <form id="formEditMealType" class="space-y-3">
            <input type="hidden" id="e_oldMealType" />
            <div class="form-control">
                <label class="label"><span class="label-text">Meal Type Name</span></label>
                <input type="text" id="e_mealTypeName" class="input input-bordered w-full" required />
            </div>
            <div class="modal-action">
                <button type="button" class="btn" onclick="edit_mealType_modal.close()">Cancel</button>
                <button type="submit" class="btn btn-primary">Update</button>
            </div>
        </form>
    </div>
</dialog>
