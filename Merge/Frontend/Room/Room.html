<!-- Modal — View -->

<dialog id="room_list_modal" class="modal">
    <div class="modal-box w-11/12 max-w-5xl">
        <h3 class="font-bold text-xl mb-4 text-primary">🛏️ Rooms</h3>
        <div class="overflow-x-auto h-[28rem] border border-base-300 rounded-xl">
            <table class="table table-zebra table-pin-rows w-full">
                <thead>
                    <tr class="bg-base-200">
                        <th>Room</th>
                        <th>Type</th>
                        <th>Floor</th>
                        <th>Rent</th>
                        <th>Seats</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="roomTableBody"></tbody>
            </table>
        </div>
        <div class="modal-action">
            <form method="dialog"><button class="btn">Close</button></form>
        </div>
    </div>
</dialog>

<!-- Modal — Add -->

<dialog id="add_room_modal" class="modal">
    <div class="modal-box w-11/12 max-w-2xl">
        <h3 class="font-bold text-lg mb-4 text-primary">🛏️ Add New Room</h3>
        <form id="formAddRoom" class="grid grid-cols-2 gap-4">
            <div class="form-control">
                <label class="label"><span class="label-text">Room No</span></label>
                <input type="number" id="r_roomNo" class="input input-bordered w-full" required />
            </div>
            <div class="form-control">
                <label class="label"><span class="label-text">Type</span></label>
                <select id="r_roomType" class="select select-bordered w-full" required></select>
            </div>
            <div class="form-control">
                <label class="label"><span class="label-text">Floor</span></label>
                <select id="r_floorNo" class="select select-bordered w-full" required></select>
            </div>
            <div class="form-control">
                <label class="label"><span class="label-text">Rent/Day</span></label>
                <input type="number" id="r_rentFee" class="input input-bordered w-full" required />
            </div>
            <div class="form-control col-span-2">
                <label class="label"><span class="label-text">Total Seats</span></label>
                <input type="number" id="r_totalSeat" class="input input-bordered w-full" required />
            </div>
            <div class="modal-action col-span-2">
                <button type="button" class="btn" onclick="add_room_modal.close()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</dialog>
