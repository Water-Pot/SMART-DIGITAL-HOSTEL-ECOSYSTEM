<!-- Modal — View -->

<dialog id="floor_list_modal" class="modal">
    <div class="modal-box w-11/12 max-w-4xl">
        <h3 class="font-bold text-xl mb-4 text-primary">🏢 Floors</h3>
        <div class="overflow-x-auto h-[28rem] border border-base-300 rounded-xl">
            <table class="table table-zebra table-pin-rows w-full">
                <thead>
                    <tr class="bg-base-200">
                        <th>Floor ID</th>
                        <th>Floor Number</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody id="floorTableBody"></tbody>
            </table>
        </div>
        <div class="modal-action">
            <form method="dialog"><button class="btn">Close</button></form>
        </div>
    </div>
</dialog>

<!-- Modal — Add -->

<dialog id="add_floor_modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4 text-primary">🏢 Add Floor</h3>
        <form id="formAddFloor" class="space-y-3">
            <div class="form-control">
                <label class="label"><span class="label-text">Floor Number</span></label>
                <input type="number" id="floorNo" class="input input-bordered w-full" required />
            </div>
            <div class="modal-action">
                <button type="button" class="btn" onclick="add_floor_modal.close()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</dialog>
