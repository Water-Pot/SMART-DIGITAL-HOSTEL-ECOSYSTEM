<!-- Modal — View -->

<dialog id="roomType_list_modal" class="modal">
    <div class="modal-box w-11/12 max-w-4xl">
        <h3 class="font-bold text-xl mb-4 text-primary">🔖 Room Types</h3>
        <div class="overflow-x-auto h-[28rem] border border-base-300 rounded-xl">
            <table class="table table-zebra table-pin-rows w-full">
                <thead>
                    <tr class="bg-base-200">
                        <th>ID</th>
                        <th>Room Type</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody id="roomTypeTableBody"></tbody>
            </table>
        </div>
        <div class="modal-action">
            <form method="dialog"><button class="btn">Close</button></form>
        </div>
    </div>
</dialog>

<!-- Modal — Add -->

<dialog id="add_roomType_modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4 text-primary">🔖 Add Room Type</h3>
        <form id="formAddRoomType" class="space-y-3">
            <div class="form-control">
                <label class="label"><span class="label-text">Type Name</span></label>
                <input type="text" id="roomTypeName" class="input input-bordered w-full" required />
            </div>
            <div class="modal-action">
                <button type="button" class="btn" onclick="add_roomType_modal.close()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</dialog>
